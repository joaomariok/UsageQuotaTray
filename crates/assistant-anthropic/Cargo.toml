[package]
name = "uqt-assistant-anthropic"
description = "Claude Code Assistant (Anthropic first-party billing): reads Claude Code's login, calls the usage endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uqt-core.workspace = true
log.workspace = true
serde.workspace = true
# preserve_order: the installer keeps Claude Code's settings keys in their order.
serde_json = { workspace = true, features = ["preserve_order"] }
# Existence checks for ANTHROPIC_API_KEY (process environment and registry); no values.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile.workspace = true
