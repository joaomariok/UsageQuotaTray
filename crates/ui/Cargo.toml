[package]
name = "uqt-ui"
description = "UsageQuotaTray UI: tray icon, popup, icon rendering, presentation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Reads the measurement and screenshot switches (UQT_READY_FILE, UQT_ICON_CHURN,
# UQT_NOTIFICATIONS, UQT_SHOT) and runs their timers. Off in shipped builds.
dev-hooks = []

[dependencies]
uqt-core.workspace = true
log.workspace = true
resvg = { version = "0.49", default-features = false }
raw-window-handle = "0.6"
# Software renderer only: the GPU renderer cost about 60 MiB in the prototype.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "raw-window-handle-06",
    "compat-1-2",
] }
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile.workspace = true
