[package]
name = "uqt-assistant-template"
description = "Template for a new Assistant module; copy it, do not register it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uqt-core.workspace = true
log.workspace = true
# preserve_order: Breakdown parts keep the order the service gave them.
serde_json = { workspace = true, features = ["preserve_order"] }
