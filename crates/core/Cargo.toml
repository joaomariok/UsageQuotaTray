[package]
name = "uqt-core"
description = "UsageQuotaTray core: Meter model, Assistant and Source contracts, engine, logging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# The only HTTP crate in the workspace (deny.toml lets nothing else depend on it).
# SChannel with the system certificate store; the Windows static proxy via the registry.
ureq = { version = "3.5", default-features = false, features = [
    "native-tls-no-default",
    "win-system-proxy",
] }
# The push channel's named pipe and its current-user-only security descriptor.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
