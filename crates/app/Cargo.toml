[package]
name = "uqt-app"
description = "UsageQuotaTray: composition root, the only crate that names Assistant modules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "usagequotatray"
path = "src/main.rs"

# Claude Code's statusLine command (the statusline push); ships next to the app.
[[bin]]
name = "uqt-statusline"
path = "src/bin/uqt-statusline.rs"

[features]
# Development switches read from the environment: the UI's measurement hooks plus
# UQT_CLAUDE_CODE, UQT_FAKE_ASSISTANT and UQT_FAKE_FAIL. Off in shipped builds, which
# ignore every UQT_* variable; debug builds run the Fake Assistant either way.
dev-hooks = ["uqt-ui/dev-hooks"]

[dependencies]
uqt-core.workspace = true
uqt-ui.workspace = true
uqt-assistant-fake.workspace = true
uqt-assistant-anthropic.workspace = true
log.workspace = true

[dev-dependencies]
tempfile.workspace = true
