# cargo-deny: licenses, advisories, bans and sources for the whole workspace.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # Slint is used under its royalty-free license (attribution in the README).
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Core and UI must never depend on an Assistant module; only the app crate
    # (the composition root) may.
    { crate = "uqt-assistant-fake", wrappers = ["uqt-app"] },
    { crate = "uqt-assistant-anthropic", wrappers = ["uqt-app"] },
    # The template is copied, never registered: today nothing depends on it, and core
    # or ui never may. (An empty wrapper list would ban the workspace member itself.)
    { crate = "uqt-assistant-template", wrappers = ["uqt-app"] },
    # Only core may depend on the HTTP crate: modules reach the network through Core's
    # host client, which enforces each module's allowed hosts.
    { crate = "ureq", wrappers = ["uqt-core"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
