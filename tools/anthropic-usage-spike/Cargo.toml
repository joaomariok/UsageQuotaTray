[package]
name = "anthropic-usage-spike"
version = "0.1.0"
edition = "2024"
publish = false
description = "Phase 0 spike: inspect Claude Code's local login and the OAuth usage endpoint, printing no secrets"
license = "MIT"

[dependencies]
serde_json = "1"
# Windows SChannel with the system certificate store, so corporate root certificates work.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
