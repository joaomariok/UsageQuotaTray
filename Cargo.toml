[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ui",
    "crates/assistant-fake",
    "crates/assistant-anthropic",
    "crates/app",
]
# Phase 0 spikes and prototypes keep their own lockfiles.
exclude = ["tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
uqt-core = { path = "crates/core" }
uqt-ui = { path = "crates/ui" }
uqt-assistant-fake = { path = "crates/assistant-fake" }
uqt-assistant-anthropic = { path = "crates/assistant-anthropic" }
log = { version = "0.4.29", features = ["std"] }
serde_json = "1"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
